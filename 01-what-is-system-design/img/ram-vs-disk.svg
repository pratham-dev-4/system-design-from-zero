<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="Helvetica Neue,Arial,sans-serif" font-size="15"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1d3fcc"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c0392b"/></marker></defs><rect x="20" y="30" width="360" height="260" rx="8" fill="#fff" stroke="#dfe3ec" stroke-width="1.6"/><text x="200.0" y="165.0" text-anchor="middle" font-weight="700"></text><rect x="400" y="30" width="360" height="260" rx="8" fill="#fff" stroke="#dfe3ec" stroke-width="1.6"/><text x="580.0" y="165.0" text-anchor="middle" font-weight="700"></text><text x="200" y="64" text-anchor="middle" font-size="18" fill="#1d3fcc" font-weight="700">RAM (memory)</text><text x="580" y="64" text-anchor="middle" font-size="18" fill="#1d3fcc" font-weight="700">Disk (SSD or hard drive)</text><text x="200" y="112" text-anchor="middle" font-size="14.5" fill="#141a26" font-weight="400">One read: about 100 ns</text><text x="580" y="112" text-anchor="middle" font-size="14" fill="#141a26" font-weight="400">One read: 100 µs (SSD) to 10 ms (HDD)</text><text x="200" y="158" text-anchor="middle" font-size="14.5" fill="#141a26" font-weight="400">Power cut: everything is gone</text><text x="580" y="158" text-anchor="middle" font-size="14" fill="#141a26" font-weight="400">Power cut: everything is still there</text><text x="200" y="204" text-anchor="middle" font-size="14.5" fill="#141a26" font-weight="400">Size: tens to hundreds of GB</text><text x="580" y="204" text-anchor="middle" font-size="14" fill="#141a26" font-weight="400">Size: many TB</text><text x="200" y="250" text-anchor="middle" font-size="14.5" fill="#141a26" font-weight="400">Job: fast scratch space</text><text x="580" y="250" text-anchor="middle" font-size="14" fill="#141a26" font-weight="400">Job: the permanent copy</text><text x="390" y="318" text-anchor="middle" font-size="13" fill="#5b6475" font-weight="400">An SSD read is about 1,000 times slower than RAM. A hard drive read is about 100,000 times slower.</text></svg>