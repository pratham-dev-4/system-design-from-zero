<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="Helvetica Neue,Arial,sans-serif" font-size="15"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1d3fcc"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c0392b"/></marker></defs><text x="210" y="28" text-anchor="middle" font-size="16" fill="#1d3fcc" font-weight="700">Traffic decides the app servers</text><text x="640" y="28" text-anchor="middle" font-size="16" fill="#1d3fcc" font-weight="700">Data decides the storage</text><rect x="30" y="46" width="360" height="58" rx="8" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="210.0" y="72.0" text-anchor="middle" font-weight="400">3 million users × 10 opens a day</text><text x="210.0" y="91.0" text-anchor="middle" font-size="12.5" fill="#5b6475">= 30 million requests a day</text><line x1="210" y1="104" x2="210" y2="114" stroke="#1d3fcc" stroke-width="1.8" marker-end="url(#a)"/><rect x="30" y="116" width="360" height="58" rx="8" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="210.0" y="142.0" text-anchor="middle" font-weight="400">÷ 86,400 seconds in a day</text><text x="210.0" y="161.0" text-anchor="middle" font-size="12.5" fill="#5b6475">= about 350 a second, on average</text><line x1="210" y1="174" x2="210" y2="184" stroke="#1d3fcc" stroke-width="1.8" marker-end="url(#a)"/><rect x="30" y="186" width="360" height="58" rx="8" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="210.0" y="212.0" text-anchor="middle" font-weight="400">× 5 for the busiest hour</text><text x="210.0" y="231.0" text-anchor="middle" font-size="12.5" fill="#5b6475">= plan for about 1,800 a second</text><line x1="210" y1="244" x2="210" y2="254" stroke="#1d3fcc" stroke-width="1.8" marker-end="url(#a)"/><rect x="30" y="256" width="360" height="58" rx="8" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="210.0" y="282.0" text-anchor="middle" font-weight="400">÷ 300 per server</text><text x="210.0" y="301.0" text-anchor="middle" font-size="12.5" fill="#5b6475">= 6 servers, run 8 for spare room</text><rect x="460" y="46" width="360" height="64" rx="8" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="640.0" y="75.0" text-anchor="middle" font-weight="400">3 million users × 1.5 MB each</text><text x="640.0" y="94.0" text-anchor="middle" font-size="12.5" fill="#5b6475">= 4.5 TB</text><line x1="640" y1="110" x2="640" y2="134" stroke="#1d3fcc" stroke-width="1.8" marker-end="url(#a)"/><rect x="460" y="138" width="360" height="64" rx="8" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="640.0" y="167.0" text-anchor="middle" font-weight="400">× 3 copies, so a dead machine</text><text x="640.0" y="186.0" text-anchor="middle" font-size="12.5" fill="#5b6475">loses nothing = 13.5 TB</text><line x1="640" y1="202" x2="640" y2="226" stroke="#1d3fcc" stroke-width="1.8" marker-end="url(#a)"/><rect x="460" y="230" width="360" height="64" rx="8" fill="#fff1c4" stroke="#b7950b" stroke-width="1.6"/><text x="640.0" y="259.0" text-anchor="middle" font-weight="400">It grows every day</text><text x="640.0" y="278.0" text-anchor="middle" font-size="12.5" fill="#5b6475">so in time you split it</text></svg>