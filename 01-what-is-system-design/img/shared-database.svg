<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="Helvetica Neue,Arial,sans-serif" font-size="15"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1d3fcc"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c0392b"/></marker></defs><text x="20" y="30" text-anchor="start" font-size="17" fill="#c0392b" font-weight="700">Wrong: each server keeps its own data</text><rect x="30" y="50" width="120" height="46" rx="8" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="90.0" y="78.0" text-anchor="middle" font-weight="700">You</text><rect x="240" y="50" width="150" height="46" rx="8" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="315.0" y="78.0" text-anchor="middle" font-weight="700">Load balancer</text><rect x="480" y="44" width="150" height="54" rx="8" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="555.0" y="68.0" text-anchor="middle" font-weight="700">Server A</text><text x="555.0" y="87.0" text-anchor="middle" font-size="12.5" fill="#5b6475">has your booking</text><rect x="480" y="124" width="150" height="54" rx="8" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="555.0" y="148.0" text-anchor="middle" font-weight="700">Server B</text><text x="555.0" y="167.0" text-anchor="middle" font-size="12.5" fill="#5b6475">has nothing</text><line x1="150" y1="73" x2="236" y2="73" stroke="#1d3fcc" stroke-width="1.8" marker-end="url(#a)"/><circle cx="193" cy="58" r="11" fill="#1d3fcc"/><text x="193" y="63" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="700">1</text><line x1="390" y1="70" x2="476" y2="70" stroke="#1d3fcc" stroke-width="1.8" marker-end="url(#a)"/><circle cx="433" cy="56" r="11" fill="#1d3fcc"/><text x="433" y="61" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="700">2</text><line x1="390" y1="86" x2="476" y2="148" stroke="#c0392b" stroke-width="1.8" marker-end="url(#r)"/><circle cx="425" cy="132" r="11" fill="#1d3fcc"/><text x="425" y="137" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="700">3</text><text x="645" y="156" text-anchor="start" font-size="14" fill="#c0392b" font-weight="700">"No tickets found"</text><text x="20" y="215" text-anchor="start" font-size="13.5" fill="#5b6475" font-weight="400">1: you book a ticket. 2: it lands on A, and A saves it on its own disk.</text><text x="20" y="236" text-anchor="start" font-size="13.5" fill="#5b6475" font-weight="400">3: later you open "My tickets". That request lands on B, which has never heard of it.</text><line x1="20" y1="262" x2="800" y2="262" stroke="#dfe3ec"/><text x="20" y="295" text-anchor="start" font-size="17" fill="#1e8449" font-weight="700">Right: every server uses one shared database</text><rect x="30" y="355" width="120" height="46" rx="8" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="90.0" y="383.0" text-anchor="middle" font-weight="700">You</text><rect x="220" y="355" width="150" height="46" rx="8" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="295.0" y="383.0" text-anchor="middle" font-weight="700">Load balancer</text><rect x="430" y="315" width="120" height="44" rx="8" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="490.0" y="342.0" text-anchor="middle" font-weight="700">Server A</text><rect x="430" y="373" width="120" height="44" rx="8" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="490.0" y="400.0" text-anchor="middle" font-weight="700">Server B</text><rect x="430" y="431" width="120" height="44" rx="8" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="490.0" y="458.0" text-anchor="middle" font-weight="700">Server C</text><line x1="150" y1="378" x2="216" y2="378" stroke="#1d3fcc" stroke-width="1.8" marker-end="url(#a)"/><line x1="370" y1="378" x2="426" y2="337" stroke="#1d3fcc" stroke-width="1.8" marker-end="url(#a)"/><line x1="370" y1="378" x2="426" y2="378" stroke="#1d3fcc" stroke-width="1.8" marker-end="url(#a)"/><line x1="370" y1="378" x2="426" y2="419" stroke="#1d3fcc" stroke-width="1.8" marker-end="url(#a)"/><path d="M640,342 v76 a75.0,12 0 0,0 150,0 v-76" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><ellipse cx="715.0" cy="342" rx="75.0" ry="12" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="715.0" y="388.0" text-anchor="middle" font-weight="700">Database</text><text x="715.0" y="406.0" text-anchor="middle" font-size="12.5" fill="#5b6475">the one true copy</text><line x1="550" y1="337" x2="636" y2="380" stroke="#1d3fcc" stroke-width="1.8" marker-end="url(#a)"/><line x1="550" y1="395" x2="636" y2="380" stroke="#1d3fcc" stroke-width="1.8" marker-end="url(#a)"/><line x1="550" y1="453" x2="636" y2="380" stroke="#1d3fcc" stroke-width="1.8" marker-end="url(#a)"/><text x="20" y="500" text-anchor="start" font-size="13.5" fill="#5b6475" font-weight="400">Any server can answer any request, because none of them keeps the data.</text></svg>