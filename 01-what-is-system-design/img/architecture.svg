<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="Helvetica Neue,Arial,sans-serif" font-size="15"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1d3fcc"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c0392b"/></marker></defs><rect x="20" y="120" width="120" height="60" rx="8" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="80.0" y="147.0" text-anchor="middle" font-weight="700">Phones and</text><text x="80.0" y="166.0" text-anchor="middle" font-size="12.5" fill="#5b6475">browsers</text><rect x="185" y="125" width="130" height="50" rx="8" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="250.0" y="155.0" text-anchor="middle" font-weight="700">Load balancer</text><rect x="370" y="50" width="150" height="50" rx="8" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="445.0" y="80.0" text-anchor="middle" font-weight="700">App server A</text><rect x="370" y="130" width="150" height="50" rx="8" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="445.0" y="160.0" text-anchor="middle" font-weight="700">App server B</text><rect x="370" y="210" width="150" height="50" rx="8" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="445.0" y="240.0" text-anchor="middle" font-weight="700">App server C</text><rect x="600" y="40" width="140" height="58" rx="8" fill="#fff1c4" stroke="#b7950b" stroke-width="1.6"/><text x="670.0" y="66.0" text-anchor="middle" font-weight="700">Cache</text><text x="670.0" y="85.0" text-anchor="middle" font-size="12.5" fill="#5b6475">copy in RAM</text><path d="M610,182 v86 a65.0,12 0 0,0 130,0 v-86" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><ellipse cx="675.0" cy="182" rx="65.0" ry="12" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="675.0" y="233.0" text-anchor="middle" font-weight="700">Database</text><text x="675.0" y="251.0" text-anchor="middle" font-size="12.5" fill="#5b6475">on disk</text><line x1="140" y1="150" x2="181" y2="150" stroke="#1d3fcc" stroke-width="1.8" marker-end="url(#a)"/><circle cx="160" cy="132" r="11" fill="#1d3fcc"/><text x="160" y="137" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="700">1</text><line x1="315" y1="150" x2="366" y2="75" stroke="#1d3fcc" stroke-width="1.8" marker-end="url(#a)"/><line x1="315" y1="150" x2="366" y2="155" stroke="#1d3fcc" stroke-width="1.8" marker-end="url(#a)"/><line x1="315" y1="150" x2="366" y2="235" stroke="#1d3fcc" stroke-width="1.8" marker-end="url(#a)"/><circle cx="340" cy="112" r="11" fill="#1d3fcc"/><text x="340" y="117" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="700">2</text><line x1="520" y1="150" x2="596" y2="72" stroke="#1d3fcc" stroke-width="1.8" marker-end="url(#a)"/><circle cx="556" cy="100" r="11" fill="#1d3fcc"/><text x="556" y="105" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="700">3</text><line x1="520" y1="162" x2="606" y2="222" stroke="#1d3fcc" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="6 4"/><circle cx="560" cy="205" r="11" fill="#1d3fcc"/><text x="560" y="210" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="700">4</text><text x="440" y="322" text-anchor="middle" font-size="12.5" fill="#5b6475" font-weight="400">1: a request goes out  2: any app server takes it  3: check the cache first  4: only on a miss, ask the database</text><text x="760" y="70" text-anchor="start" font-size="13" fill="#1e8449" font-weight="700">Add more app</text><text x="760" y="88" text-anchor="start" font-size="13" fill="#1e8449" font-weight="700">servers freely.</text><text x="760" y="225" text-anchor="start" font-size="13" fill="#c0392b" font-weight="700">Only one of</text><text x="760" y="243" text-anchor="start" font-size="13" fill="#c0392b" font-weight="700">these.</text></svg>