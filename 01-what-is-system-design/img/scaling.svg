<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" font-family="Helvetica Neue,Arial,sans-serif" font-size="15"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1d3fcc"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c0392b"/></marker></defs><path d="M360,27 v76 a70.0,12 0 0,0 140,0 v-76" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><ellipse cx="430.0" cy="27" rx="70.0" ry="12" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="430.0" y="73.0" text-anchor="middle" font-weight="700">One database</text><rect x="20" y="145" width="260" height="58" rx="8" fill="#fff1c4" stroke="#b7950b" stroke-width="1.6"/><text x="150.0" y="171.0" text-anchor="middle" font-weight="700">Speed</text><text x="150.0" y="190.0" text-anchor="middle" font-size="12.5" fill="#5b6475">too many reads and writes</text><rect x="300" y="145" width="260" height="58" rx="8" fill="#fff1c4" stroke="#b7950b" stroke-width="1.6"/><text x="430.0" y="171.0" text-anchor="middle" font-weight="700">Size</text><text x="430.0" y="190.0" text-anchor="middle" font-size="12.5" fill="#5b6475">more data than one machine holds</text><rect x="580" y="145" width="260" height="58" rx="8" fill="#fff1c4" stroke="#b7950b" stroke-width="1.6"/><text x="710.0" y="171.0" text-anchor="middle" font-weight="700">Reliability</text><text x="710.0" y="190.0" text-anchor="middle" font-size="12.5" fill="#5b6475">if it dies, the app stops</text><rect x="60" y="250" width="320" height="60" rx="8" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="220.0" y="277.0" text-anchor="middle" font-weight="700">Scale up (vertical)</text><text x="220.0" y="296.0" text-anchor="middle" font-size="12.5" fill="#5b6475">buy a bigger machine</text><rect x="480" y="250" width="320" height="60" rx="8" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="640.0" y="277.0" text-anchor="middle" font-weight="700">Scale out (horizontal)</text><text x="640.0" y="296.0" text-anchor="middle" font-size="12.5" fill="#5b6475">use many machines</text><text x="220" y="340" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="400">Simple, but there is a biggest machine,</text><text x="220" y="358" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="400">and it is still one machine that can die.</text><rect x="440" y="375" width="180" height="58" rx="8" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="530.0" y="401.0" text-anchor="middle" font-weight="700">Replication</text><text x="530.0" y="420.0" text-anchor="middle" font-size="12.5" fill="#5b6475">copy the same data</text><rect x="640" y="375" width="190" height="58" rx="8" fill="#eef1fd" stroke="#1d3fcc" stroke-width="1.6"/><text x="735.0" y="401.0" text-anchor="middle" font-weight="700">Partitioning</text><text x="735.0" y="420.0" text-anchor="middle" font-size="12.5" fill="#5b6475">split the data</text><line x1="640" y1="310" x2="535" y2="371" stroke="#1d3fcc" stroke-width="1.8" marker-end="url(#a)"/><line x1="640" y1="310" x2="735" y2="371" stroke="#1d3fcc" stroke-width="1.8" marker-end="url(#a)"/></svg>